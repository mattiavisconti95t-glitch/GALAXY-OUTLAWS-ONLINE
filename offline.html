function status(s){$('#status').textContent=s}
function toast(s){$('#toast').textContent=s}
function render(){if(!state||!state.current)return;$('#round').textContent=`TAGLIA ${state.round}/20`;$('#score').textContent=`${state.players[0].credits} ¢ · ${state.players[0].bounties} TAGLIE`;$('#wantedCard').src=img('wanted',state.current.name);$('#wantedHealth').innerHTML=health(state.current.name,state.current.hp,state.current.maxHp);$('#hunterHud').innerHTML=state.players.map((p,i)=>`<div class="hunterBadge"><img src="${badgePath(p.name)}" alt="${p.name}"><span class="hpNumber"><b>♥</b> ${p.hp}</span></div>`).join('');const hand=$('#handCards');hand.replaceChildren();state.players[0].hand.forEach((c,i)=>{const b=document.createElement('button');b.className='handCard'+(selected===i?' selected':'');const pic=document.createElement('img');pic.src=img(c.type,c.type==='heal'?c.power:c.speed);pic.alt=c.type==='heal'?`Cura ${c.power}`:`Velocità ${c.speed} danno ${c.power}`;b.append(pic);b.onclick=()=>{if(duelSelect){duelSelect(i);return}if(locked)return;selected=i;render()};hand.append(b)});$('#playBtn').disabled=locked||selected<0||state.over||state.players[0].hp<=0;updatePiles();save()}
function modal(title,message,button='CONTINUA'){return new Promise(resolve=>{$('#modalTitle').textContent=title;$('#modalText').textContent=message;$('#modalButton').textContent=button;$('#modal').classList.add('show');$('#modalButton').onclick=()=>{$('#modal').classList.remove('show');resolve()}})}
function endGame(reason){state.over=true;render();const ranking=[...state.players].sort((a,b)=>b.credits-a.credits);modal('FINE PARTITA',reason+'\n'+ranking.map(p=>p.name+': '+p.credits+' crediti').join('\n'),'MENU').then(()=>showScreen('menu'));save()}
function setSlots(entries,faceDown=true){const grid=$('#played');grid.replaceChildren();const n=state.players.length;const start=n===2?1:0;for(let i=0;i<4;i++){const box=document.createElement('div');box.className='playedCard';box.id='slot'+i;const e=entries.find(e=>e.idx===i-start);if(e){const pic=document.createElement('img');pic.src=faceDown?'./card-back.webp':img(e.card.type,e.card.type==='heal'?e.card.power:e.card.speed);pic.onerror=()=>{if(faceDown)pic.style.background='#301311'};box.append(pic)}grid.append(box)}}
async function dealAnimation(){const el=$('#dealCard'),pic=el.querySelector('img');pic.src='./card-back.webp';el.style.display='block';for(let i=0;i<Math.min(state.players[0].hand.length,5);i++){el.style.transition='none';el.style.left='24%';el.style.top='76%';el.style.opacity='1';el.style.transform='scale(.8)';await wait(40);el.style.transition='transform .38s,opacity .38s,left .38s,top .38s';el.style.left=(25+i*12)+'%';el.style.top='90%';el.style.transform='scale(1)';el.style.opacity='0';await wait(120)}el.style.display='none'}
async function nextWanted(){if(!state.wanted.length){endGame('I 20 ricercati sono terminati. Vince chi ha più crediti.');return}let [name,value,power]=state.wanted.pop();state.current={name,value,power,hp:state.players.length*5,maxHp:state.players.length*5};state.round++;state.players.forEach(p=>{if(p.hp>0)refill(p)});selected=-1;setSlots([]);render();status('NUOVA TAGLIA: '+name+' · '+value+' CREDITI');locked=true;await dealAnimation();locked=false;render();status('SCEGLI UNA CARTA DALLA TUA MANO')}
async function start(n,chosen){const names=[chosen,...shuffle(hunters.filter(x=>x!==chosen)).slice(0,n-1)];state={players:names.map((name,i)=>({name,hp:5,credits:0,bounties:0,hand:[],bot:i>0})),deck:attackDeck(),discard:[],wanted:shuffle(wantedData),current:null,round:0,over:false};$('#subMenu').classList.remove('show');$('#hunterSelect').classList.remove('show');showScreen('board');await wait(750);await nextWanted()}
function botPick(p){if(!p.hand.length)return -1;let ranked=p.hand.map((c,i)=>({c,i,score:c.type==='heal'?(p.hp<=2?10:0)+c.power:c.power+0.25*c.speed})).sort((a,b)=>b.score-a.score);return Math.random()<.2?Math.floor(Math.random()*p.hand.length):ranked[0].i}
function duelSpeed(c){return c.type==='heal'?0:c.speed}
function showDuelCards(results, faceUp=false){
 const slots=$('#duelChoices');slots.replaceChildren();
 for(const r of results){
  const box=document.createElement('div');box.className='duelSlot';
  const image=document.createElement('img');image.src=faceUp&&r.card?img(r.card.type,r.card.type==='heal'?r.card.power:r.card.speed):'./card-back.webp';
  const label=document.createElement('span');label.textContent=state.players[r.e.idx].name+(faceUp?' · '+r.speed:'');
  box.append(image,label);slots.append(box);
 }
}
async function chooseDuelCard(p){
 if(!p.hand.length)return {speed:0,empty:true,card:null};
 if(p.bot){const k=botPick(p);const c=p.hand.splice(k,1)[0];return {speed:duelSpeed(c),empty:false,card:c}}
 return new Promise(resolve=>{
  $('#duelInfo').textContent='DUELLO! Scegli una carta dalla tua mano, sempre visibile in basso.';
  duelSelect=(i)=>{
   if(i<0||i>=p.hand.length)return;
   const c=p.hand.splice(i,1)[0];duelSelect=null;
   render();resolve({speed:duelSpeed(c),empty:false,card:c});
  };
  render();status('DUELLO! SCEGLI UNA CARTA DALLA MANO');
 });
}
async function resolveDuels(entries){
 const groups=new Map();
 for(const e of entries){const key=e.card.type==='heal'?'heal-'+e.card.speed:'attack-'+e.card.speed;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)}
 for(const [speed,group] of groups){
  if(group.length<2)continue;
  $('#duelOverlay').classList.add('show');$('#duelInfo').textContent='PARITÀ DI VELOCITÀ '+speed+' — DUELLO!';showDuelCards(group.map(e=>({e,card:null,speed:0})));status('DUELLO! VELOCITÀ '+speed);await wait(650);
  // Risolve ricorsivamente solo i giocatori ancora in parità, preservando l'ordine già acquisito.
  async function rank(tied){
   if(tied.length<=1)return tied;
   let results=[];
   const allEmpty=tied.every(e=>state.players[e.idx].hand.length===0);
   if(allEmpty){
    // I giocatori senza carte pescano dal mazzo per rompere la parità.
    for(const e of tied){const c=draw();if(c){discardCard(c);results.push({e,speed:duelSpeed(c),card:c})}else results.push({e,speed:0,card:null})}
   }else{
    for(const e of tied){const result=await chooseDuelCard(state.players[e.idx]);results.push({e,speed:result.speed,card:result.card||null})}
   }
   showDuelCards(results,false);$('#duelInfo').textContent='CARTE DEL DUELLO COPERTE';await wait(500);showDuelCards(results,true);$('#duelInfo').textContent='CARTE RIVELATE — '+results.map(x=>state.players[x.e.idx].name+' '+x.speed).join(' · ');for(const x of results){if(x.card)discardCard(x.card)}await wait(1100);
   const unique=[...new Set(results.map(x=>x.speed))].sort((a,b)=>b-a);
   if(unique.length===1 && allEmpty){return tied}
   const ordered=[];
   for(const v of unique){const subset=results.filter(x=>x.speed===v).map(x=>x.e);if(subset.length>1)ordered.push(...await rank(subset));else ordered.push(...subset)}
   return ordered;
  }
  const ordered=await rank(group);ordered.forEach((e,i)=>e.duelRank=i);
  $('#duelInfo').textContent='ORDINE DI SPARO: '+ordered.map(e=>state.players[e.idx].name).join(' → ');await wait(900);$('#duelOverlay').classList.remove('show');
 }
 return entries.sort((a,b)=>{
  if(a.card.type==='heal'&&b.card.type!=='heal')return 1;
  if(b.card.type==='heal'&&a.card.type!=='heal')return -1;
  return b.card.speed-a.card.speed||(a.duelRank??0)-(b.duelRank??0)
 });
}
async function shoot(slot){const el=document.createElement('div');el.className='bullet';el.style.left=(17+slot*22)+'%';el.style.top='60%';$('#effectLayer').append(el);await wait(320);el.remove();const imp=document.createElement('div');imp.className='impact';imp.textContent='✹';$('#effectLayer').append(imp);setTimeout(()=>imp.remove(),550)}
async function play(){if(locked||selected<0)return;locked=true;const entries=[];state.players.forEach((p,idx)=>{if(p.hp<=0)return;const k=idx===0?selected:botPick(p);if(k<0)return;const card=p.hand.splice(k,1)[0];entries.push({idx,card})});selected=-1;setSlots(entries,true);render();status('CARTE GIOCATE COPERTE');await wait(850);setSlots(entries,false);document.querySelectorAll('.playedCard img').forEach(x=>x.parentElement.classList.add('reveal'));status('CARTE RIVELATE');await wait(2000);await resolveDuels(entries);let capture=null;for(const e of entries){const p=state.players[e.idx];if(p.hp<=0)continue;const start=state.players.length===2?1:0;const slot=e.idx+start;const cardEl=$('#slot'+slot);cardEl?.classList.add('fire');if(e.card.type==='heal'){p.hp=Math.min(5,p.hp+e.card.power);status(p.name+' RECUPERA '+e.card.power+' VITA')}else if(state.current.hp>0){status(p.name+' SPARA! −'+e.card.power+' VITA');await shoot(slot);state.current.hp=Math.max(0,state.current.hp-e.card.power);if(state.current.hp===0){capture=p}}render();await wait(1000);cardEl?.classList.remove('fire');if(capture)break}for(const e of entries){await animateDiscard(e.card,e.idx+(state.players.length===2?1:0))}setSlots([]);if(capture){capture.bounties++;capture.credits+=state.current.value;render();await modal('TAGLIA CATTURATA',capture.name+' cattura '+state.current.name+'!\n+'+state.current.value+' CREDITI');if(capture.bounties>=10){endGame(capture.name+' ha catturato 10 taglie.');return}await nextWanted();return}else{const attacks=entries.filter(e=>e.card.type==='attack'&&state.players[e.idx].hp>0);if(attacks.length){const target=attacks[attacks.length-1];const p=state.players[target.idx];status(state.current.name+' CONTRATTACCA '+p.name+'!');await wait(500);p.hp=Math.max(0,p.hp-state.current.power);render();await wait(650)}}const alive=state.players.filter(p=>p.hp>0);if(alive.length<=1){endGame(alive[0]?alive[0].name+' è l’ultimo cacciatore vivo.':'Nessun cacciatore sopravvissuto.');return}if(state.players[0].hp<=0){endGame('Sei stato eliminato.');return}state.players.forEach(p=>{if(p.hp>0)refill(p)});selected=-1;setSlots([]);render();await dealAnimation();locked=false;status('SCEGLI UNA CARTA DALLA TUA MANO');render()}
$('#newBtn').onclick=()=>$('#subMenu').classList.add('show');$('#cancelMenu').onclick=()=>$('#subMenu').classList.remove('show');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{chosenPlayerCount=Number(b.dataset.n);$('#subMenu').classList.remove('show');$('#hunterSelect').classList.add('show')});$('#hunterChoices').innerHTML=hunters.map(name=>`<button class="hunterChoice" data-hunter="${name}"><img src="${badgePath(name)}" alt=""><span>${name}</span></button>`).join('');document.querySelectorAll('[data-hunter]').forEach(b=>b.onclick=()=>start(chosenPlayerCount,b.dataset.hunter));$('#backToCount').onclick=()=>{$('#hunterSelect').classList.remove('show');$('#subMenu').classList.add('show')};$('#playBtn').onclick=play;$('#continueBtn').onclick=()=>{try{state=JSON.parse(localStorage.getItem('galaxy-outlaws-save-v9')||localStorage.getItem('galaxy-outlaws-save-v7'));if(!state)throw Error();locked=false;selected=-1;showScreen('board');setSlots([]);render();status('PARTITA RIPRESA')}catch(e){$('#subMenu').classList.add('show')}};$('#settingsBtn').onclick=()=>$('#settings').classList.add('show');$('#closeSettings').onclick=()=>$('#settings').classList.remove('show');$('#animToggle').onchange=e=>anim=e.target.checked;$('#backMenu').onclick=()=>modal('PAUSA','Vuoi tornare al menu? La partita viene salvata.','TORNA AL MENU').then(()=>showScreen('menu'));
</script></body></html>
