const $=s=>document.querySelector(s), hunters=['JAX','ZYRA','K-17','BRUGG'];const badge=n=>'./badge_'+n.toLowerCase().replace('-','')+'.png';const svgCard=(label,color,detail)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="252" height="352" viewBox="0 0 252 352"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="#210c12"/></linearGradient></defs><rect width="252" height="352" rx="14" fill="url(#g)"/><rect x="9" y="9" width="234" height="334" rx="10" fill="none" stroke="#f6a65c" stroke-width="8"/><text x="126" y="100" text-anchor="middle" fill="#fff2cc" font-family="sans-serif" font-size="29" font-weight="900">${label}</text><text x="126" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="64" font-weight="900">${detail}</text><text x="126" y="310" text-anchor="middle" fill="#ffb96d" font-family="sans-serif" font-size="19">GALAXY OUTLAWS</text></svg>`);
const asset=c=>'./'+c.type+'_'+(c.type==='heal'?c.power:c.speed)+'.webp';
const wantedAsset=name=>'./wanted_'+String(name).toLowerCase()+'.webp';const wanted=[['KRAAG',700,1],['NIB',650,1],['SIXX',750,1],['ZERA',750,1],['VILT',800,1],['SKAR',650,1],['MURK',850,1],['KIP',950,1],['NOVA',750,1],['RAX',750,1],['KORV',800,1],['GRIMM',850,1],['SHARD',800,1],['BRAX',700,1],['GORR',800,1],['MARA',850,2],['THORN',800,2],['VEXA',900,2],['VEX',900,2],['OXX',900,2]];const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const deck=()=>shuffle([... [6,5,4,3,2,1].flatMap((s,i)=>Array.from({length:[5,8,8,8,7,4][i]},()=>({type:'attack',speed:s,power:7-s}))),...Array.from({length:14},()=>({type:'heal',speed:0,power:1})),...Array.from({length:6},()=>({type:'heal',speed:0,power:2}))]);let db,auth,uid,roomId,room,selected=-1,count=2,processing=false;const config=window.GALAXY_FIREBASE_CONFIG||{};if(!config.apiKey||!config.projectId){$('#setupError').textContent='Multiplayer da configurare: completa firebase-config.js seguendo ISTRUZIONI_ONLINE.txt';$('#create').disabled=$('#join').disabled=true}else{try{const app=initializeApp(config);db=getFirestore(app);auth=getAuth(app);await signInAnonymously(auth);uid=auth.currentUser.uid;$('#setupError').textContent='Connesso al server multiplayer.'}catch(e){$('#setupError').textContent='Firebase: '+e.message;$('#create').disabled=$('#join').disabled=true}}
const roomRef=()=>ref(db,'rooms/'+roomId), safe=fn=>async()=>{try{await fn()}catch(e){alert('Errore: '+e.message)}};document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{$('#count').textContent=count=+b.dataset.count});const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
$('#create').onclick=safe(async()=>{roomId=code();await set(roomRef(),{host:uid,limit:count,phase:'lobby',createdAt:Date.now(),players:{[uid]:{name:'',hp:5,credits:0,bounties:0,hand:[]}},order:[uid],round:0});subscribe()});$('#join').onclick=safe(async()=>{roomId=$('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(roomId))throw Error('Codice non valido');const snap=await get(roomRef());if(!snap.exists())throw Error('Stanza inesistente');const r=snap.val();if(r.phase!=='lobby')throw Error('Partita già iniziata');if(!r.players?.[uid]&&r.order.length>=r.limit)throw Error('Stanza piena');await runTransaction(roomRef(),r=>{if(!r||r.phase!=='lobby')return;if(!r.players?.[uid]){if(r.order.length>=r.limit)return;r.players[uid]={name:'',hp:5,credits:0,bounties:0,hand:[]};r.order.push(uid)}return r});subscribe()});$('#share').onclick=()=>navigator.clipboard?.writeText(location.origin+location.pathname+'?room='+roomId).then(()=>alert('Invito copiato')).catch(()=>prompt('Copia il link:',location.href+'?room='+roomId));
function subscribe(){onValue(roomRef(),s=>{if(!s.exists()){alert('Stanza non disponibile');return}room=s.val();render()})}function names(){return room.order.map(id=>room.players[id]?.name).filter(Boolean)}
function render(){if(!room)return;$('#setup').classList.add('hide');$('#lobby').classList.toggle('hide',room.phase!=='lobby');document.body.classList.toggle('inGame',room.phase!=='lobby');$('#board').classList.toggle('onlineActive',room.phase!=='lobby');if(room.phase==='lobby'){$('#roomCode').textContent=roomId;$('#choices').replaceChildren();hunters.forEach(n=>{const b=document.createElement('button');b.className='choice';b.disabled=names().includes(n)&&room.players[uid]?.name!==n;b.innerHTML=`<img class="badge" src="${badge(n)}"><br>${n}`;b.onclick=safe(async()=>{await runTransaction(roomRef(),r=>{if(!r||r.phase!=='lobby'||!r.players[uid])return;if(Object.entries(r.players).some(([id,p])=>id!==uid&&p.name===n))return;r.players[uid].name=n;return r})});$('#choices').append(b)});$('#lobbyPlayers').innerHTML=room.order.map(id=>`<div class="person">${room.players[id].name||'IN ATTESA'} ${id===room.host?'★':''}</div>`).join('');$('#lobbyInfo').textContent=`${room.order.length}/${room.limit} giocatori · Tutti devono scegliere un cacciatore`;$('#start').classList.toggle('hide',uid!==room.host);$('#start').disabled=room.order.length!==room.limit||names().length!==room.limit;return}const me=room.players[uid];if(!me)return;
$('#round').textContent='TAGLIA '+room.round+'/20';$('#score').textContent=me.credits+' ¢ · '+me.bounties+' TAGLIE';
$('#hunterHud').innerHTML=room.order.map(id=>{const p=room.players[id];return `<div class="hunterBadge"><img src="${badge(p.name)}" alt="${p.name}"><span class="hpNumber"><b>♥</b> ${p.hp}</span></div>`}).join('');
$('#wantedHealth').innerHTML='<span>♥ '+(room.current?.hp||0)+' / '+(room.current?.maxHp||0)+'</span>';
$('#wantedCard').src=wantedAsset(room.current?.name||'');
$('#deckCard').style.visibility=(room.deck||[]).length?'visible':'hidden';
const last=(room.discard||[]).at(-1);$('#discardCard').src=last?asset(last):'./card-back.webp';$('#discardCard').style.visibility=(room.discard||[]).length?'visible':'hidden';
const slots=$('#played');slots.replaceChildren();const offset=room.limit===2?1:0;
for(let i=0;i<4;i++){const id=room.order[i-offset],c=id?room.plays?.[id]:null;const box=document.createElement('div');box.className='playedCard';box.id='slot'+i;if(c){const im=document.createElement('img');im.src=['reveal','duel','finished'].includes(room.phase)?asset(c):'./card-back.webp';box.append(im)}slots.append(box)}
const duel=room.phase==='duel';$('#onlineDuel').classList.toggle('show',duel);
$('#duelInfo').textContent='Parità di velocità: scegli una carta da scartare per il duello.';
$('#duelSlots').innerHTML=(room.duelIds||[]).map(id=>`<div>${room.players[id].name}<br><img src="./card-back.webp" style="opacity:${room.duelPicks?.[id]?1:.35}"></div>`).join('');
const picking=(room.phase==='choose'&&!room.plays?.[uid])||(duel&&(room.duelIds||[]).includes(uid)&&!room.duelPicks?.[uid]);
const hand=$('#handCards');hand.replaceChildren();(me.hand||[]).forEach((c,i)=>{const b=document.createElement('button');b.className='handCard'+(selected===i?' selected':'');const im=document.createElement('img');im.src=asset(c);im.alt=c.type==='heal'?'Cura '+c.power:'Attacco '+c.power;b.append(im);b.onclick=()=>{selected=i;render()};hand.append(b)});
$('#playBtn').disabled=!picking||selected<0||me.hp<=0;$('#playBtn').textContent=duel?'SCARTA DUELLO':'GIOCA COPERTA';
$('#status').textContent=picking?(duel?'SCEGLI UNA CARTA PER IL DUELLO':'SCEGLI UNA CARTA DALLA TUA MANO'):room.phase==='finished'?'PARTITA TERMINATA':room.phase==='reveal'?'CARTE RIVELATE':'IN ATTESA DEGLI ALTRI';
}
$('#start').onclick=safe(async()=>{if(uid!==room.host)return;const d=deck(),players=structuredClone(room.players);for(const id of room.order){players[id].hand=d.splice(0,5)}const w=shuffle(wanted.map(([name,value,power])=>({name,value,power})));const {name,value,power}=w.pop();await update(roomRef(),{phase:'choose',players,deck:d,wanted:w,current:{name,value,power,hp:room.limit*5,maxHp:room.limit*5},round:1,plays:{},duelPicks:{},duelIds:[],log:['Partita iniziata']})});$('#playBtn').onclick=safe(async()=>{if(selected<0)return;const ix=selected;selected=-1;await runTransaction(roomRef(),r=>{if(!r||!r.players?.[uid]||r.players[uid].hp<=0)return;const duel=r.phase==='duel';if(!duel&&r.phase!=='choose')return;if(duel&&(!(r.duelIds||[]).includes(uid)||r.duelPicks?.[uid]))return;if(!duel&&r.plays?.[uid])return;const hand=r.players[uid].hand||[];if(ix>=hand.length)return;const [c]=hand.splice(ix,1);if(duel){r.duelPicks=r.duelPicks||{};r.duelPicks[uid]=c}else{r.plays=r.plays||{};r.plays[uid]=c}return r})});
// Solo il creatore della stanza risolve i turni. La transazione impedisce doppie risoluzioni.
function speed(c){return c.type==='heal'?0:c.speed}function advance(r){const active=r.order.filter(id=>r.players[id].hp>0);if(r.phase==='choose'&&active.every(id=>r.plays?.[id])){r.phase='reveal';r.revealedAt=Date.now();r.log.push('Carte rivelate');return r}if(r.phase==='reveal'&&Date.now()-(r.revealedAt||0)>=2000){const groups={};active.forEach(id=>{const s=speed(r.plays[id]);(groups[s]??=[]).push(id)});const tied=Object.values(groups).filter(g=>g.length>1).flat();if(tied.length){r.phase='duel';r.duelIds=tied;r.duelPicks={};r.log.push('DUELLO: velocità uguali');return r}return resolve(r)}if(r.phase==='duel'&&(r.duelIds||[]).every(id=>r.duelPicks?.[id]||!(r.players[id].hand||[]).length)){return resolve(r)}return}
function resolve(r){const ids=r.order.filter(id=>r.plays?.[id]&&r.players[id].hp>0);const duels=r.duelPicks||{};ids.sort((a,b)=>speed(r.plays[b])-speed(r.plays[a])||speed(duels[b]||{type:'heal'})-speed(duels[a]||{type:'heal'})||r.order.indexOf(a)-r.order.indexOf(b));let capture=null;for(const id of ids){const p=r.players[id],c=r.plays[id];if(c.type==='heal'){p.hp=Math.min(5,p.hp+c.power);r.log.push(p.name+' cura '+c.power)}else if(r.current.hp>0){r.current.hp=Math.max(0,r.current.hp-c.power);r.log.push(p.name+' infligge '+c.power+' danni');if(r.current.hp===0){capture=id;break}}}const attackersBeforeClear=ids.filter(id=>r.plays?.[id]?.type==='attack');r.discard=[...(r.discard||[]),...Object.values(r.plays||{}),...Object.values(duels)];r.plays={};r.duelPicks={};r.duelIds=[];if(capture){const p=r.players[capture];p.credits+=r.current.value;p.bounties++;r.log.push(p.name+' cattura '+r.current.name);if(!r.wanted?.length||p.bounties>=10){r.phase='finished';return r}const {name,value,power}=r.wanted.pop();r.current={name,value,power,hp:r.limit*5,maxHp:r.limit*5};r.round++}else{const target=attackersBeforeClear.at(-1);if(target){r.players[target].hp=Math.max(0,r.players[target].hp-r.current.power);r.log.push(r.current.name+' contrattacca '+r.players[target].name)}}if(r.order.filter(id=>r.players[id].hp>0).length<=1){r.phase='finished';return r}for(const id of r.order){const p=r.players[id];if(p.hp<=0)continue;while(p.hand.length<5){if(!r.deck.length){r.deck=shuffle(r.discard||[]);r.discard=[]}if(!r.deck.length)break;p.hand.push(r.deck.pop())}}r.phase='choose';return r}
let busy=false;setInterval(async()=>{if(!room||uid!==room.host||busy||!['choose','reveal','duel'].includes(room.phase))return;const active=room.order.filter(id=>room.players[id].hp>0);const ready=room.phase==='choose'&&active.every(id=>room.plays?.[id])||room.phase==='reveal'&&Date.now()-(room.revealedAt||0)>=2000||room.phase==='duel'&&(room.duelIds||[]).every(id=>room.duelPicks?.[id]||!room.players[id].hand?.length);if(!ready)return;busy=true;try{await runTransaction(roomRef(),r=>{if(!r)return;return advance(r)})}catch(e){console.error(e)}finally{busy=false}},650);
$('#backMenu').onclick=()=>{if(confirm('Uscire dalla partita online?'))location.href='./index.html'};
const invite=new URLSearchParams(location.search).get('room');if(invite){$('#code').value=invite.toUpperCase()}
