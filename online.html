<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Outlaws Online</title><style>
*{box-sizing:border-box}body{margin:0;color:#ffe6c2;font:700 15px system-ui;background:#13080d url('./board-bg.jpg') center top/100% auto fixed}button,input{font:inherit}button{background:linear-gradient(#a83b20,#50100e);color:#fff3d5;border:2px solid #e98d40;border-radius:9px;padding:12px;cursor:pointer}button:disabled{opacity:.4}input{width:100%;padding:12px;border-radius:8px;background:#211116;color:white;border:1px solid #dc794b}.shell{max-width:540px;margin:auto;min-height:100dvh;padding:18px 12px 45px;background:#0b03068c}.panel{border:2px solid #c65a32;background:#17090edb;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 15px #0007}h1,h2{text-align:center;color:#ffcf9c;text-shadow:2px 3px #72120d}h1{margin:6px 0;font-size:29px}h2{font-size:19px}p,small{line-height:1.45}small{color:#e9bca0}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.hide{display:none!important}.choice{padding:12px}.badge{width:68px;height:68px;object-fit:contain}.players{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.person{text-align:center;font-size:12px}.person img{display:block;margin:auto}.card{width:64px;aspect-ratio:63/88;object-fit:contain;border-radius:5px;box-shadow:0 2px 8px #000}.hand{display:flex;justify-content:center;gap:5px;overflow-x:auto}.hand button{padding:0;border:2px solid #a43b24;background:#230a08;flex:0 0 auto}.hand button.sel{border-color:#ffe45d;transform:translateY(-7px)}.hand img{display:block;width:56px;aspect-ratio:63/88;object-fit:contain}.slots{display:flex;justify-content:center;gap:7px;min-height:105px}.slot{flex:1;text-align:center;font-size:11px;min-width:0}.slot img{width:100%;max-width:76px;aspect-ratio:63/88;object-fit:contain}.wanted{display:block;margin:8px auto;width:min(38%,180px);aspect-ratio:63/88;object-fit:contain}.hp{text-align:center;font-size:23px;color:#fff;background:#961e1d;border:2px solid #e6a36b;border-radius:30px;padding:5px;margin:auto;max-width:310px}.code{text-align:center;font-size:32px;letter-spacing:7px;color:#ffd26b}.msg{color:#ffcf9c;text-align:center}.duel{border:3px solid #ff5b35;box-shadow:0 0 25px #f32c20;background:#290b0eea}.duelLogo{width:80%;display:block;margin:auto}.muted{color:#d9ad97}#log{font-size:12px;white-space:pre-line}a{color:#ffe49c}
</style></head><body><div class="shell"><h1>GALAXY OUTLAWS</h1><div style="text-align:center">🌐 MULTIPLAYER v2.0</div><section id="setup" class="panel"><h2>STANZA ONLINE</h2><p id="setupError" class="msg"></p><label>Numero di giocatori</label><div class="row"><button data-count="2">2</button><button data-count="3">3</button><button data-count="4">4</button></div><p>Selezionati: <b id="count">2</b> giocatori</p><button id="create" style="width:100%">CREA STANZA</button><p>Oppure inserisci il codice di un amico:</p><input id="code" placeholder="CODICE STANZA" maxlength="6" autocapitalize="characters"><button id="join" style="width:100%">ENTRA NELLA STANZA</button><p><a href="./index.html">← Torna al menu</a></p></section><section id="lobby" class="panel hide"><h2>SALA D'ATTESA</h2><p>Condividi questo codice:</p><div id="roomCode" class="code"></div><button id="share">COPIA INVITO</button><h2>SCEGLI CACCIATORE</h2><div id="choices" class="row"></div><h2>GIOCATORI CONNESSI</h2><div id="lobbyPlayers" class="players"></div><p id="lobbyInfo" class="msg"></p><button id="start" class="hide" style="width:100%">AVVIA PARTITA</button></section><section id="game" class="hide"><div class="panel"><div id="round" class="msg"></div><div id="players" class="players"></div><div id="health" class="hp">♥ 0 / 0</div><img id="wanted" class="wanted"><div id="wantedName" class="msg"></div></div><div class="panel"><h2>CARTE GIOCATE</h2><div id="slots" class="slots"></div><p id="phase" class="msg"></p></div><div id="duel" class="panel duel hide"><img class="duelLogo" src="./duel-logo.jpg" alt="DUELLO"><p id="duelInfo" class="msg"></p><div id="duelSlots" class="slots"></div></div><div class="panel"><h2>LA TUA MANO</h2><div id="hand" class="hand"></div><button id="play" style="width:100%" disabled>GIOCA CARTA COPERTA</button><p id="info" class="msg"></p></div><div class="panel row"><div><h2>MAZZO AZIONI</h2><img src="./card-back.webp" class="card" alt="Mazzo"><p id="deckCount"></p></div><div><h2>SCARTI</h2><img id="discard" class="card" alt="Scarti"><p id="discardCount"></p></div></div><div class="panel"><h2>CRONACA</h2><div id="log"></div></div></section></div><script src="./firebase-config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,runTransaction as firestoreTransaction} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const ref=(db,path)=>doc(db,path);
const snapWrap=s=>({exists:()=>s.exists(),val:()=>s.data()});
const get=async r=>snapWrap(await getDoc(r));
const set=(r,v)=>setDoc(r,v);
const update=(r,v)=>updateDoc(r,v);
const onValue=(r,cb)=>onSnapshot(r,s=>cb(snapWrap(s)),e=>alert('Sincronizzazione: '+e.message));
const runTransaction=(r,fn)=>firestoreTransaction(r.firestore,async tx=>{const snap=await tx.get(r);const current=snap.exists()?snap.data():null;const next=fn(current);if(next===undefined)return;tx.set(r,next);});
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const $=s=>document.querySelector(s), hunters=['JAX','ZYRA','K-17','BRUGG'];const badge=n=>'./badge_'+n.toLowerCase().replace('-','')+'.png';const svgCard=(label,color,detail)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="252" height="352" viewBox="0 0 252 352"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="#210c12"/></linearGradient></defs><rect width="252" height="352" rx="14" fill="url(#g)"/><rect x="9" y="9" width="234" height="334" rx="10" fill="none" stroke="#f6a65c" stroke-width="8"/><text x="126" y="100" text-anchor="middle" fill="#fff2cc" font-family="sans-serif" font-size="29" font-weight="900">${label}</text><text x="126" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="64" font-weight="900">${detail}</text><text x="126" y="310" text-anchor="middle" fill="#ffb96d" font-family="sans-serif" font-size="19">GALAXY OUTLAWS</text></svg>`);
const asset=c=>c.type==='heal'?svgCard('CURA','#186c48','+'+c.power):svgCard('ATTACCO','#9b2a1e',c.power+' ⚡'+c.speed);
const wantedAsset=name=>svgCard('TAGLIA','#742319',name);const wanted=[['KRAAG',700,1],['NIB',650,1],['SIXX',750,1],['ZERA',750,1],['VILT',800,1],['SKAR',650,1],['MURK',850,1],['KIP',950,1],['NOVA',750,1],['RAX',750,1],['KORV',800,1],['GRIMM',850,1],['SHARD',800,1],['BRAX',700,1],['GORR',800,1],['MARA',850,2],['THORN',800,2],['VEXA',900,2],['VEX',900,2],['OXX',900,2]];const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const deck=()=>shuffle([... [6,5,4,3,2,1].flatMap((s,i)=>Array.from({length:[5,8,8,8,7,4][i]},()=>({type:'attack',speed:s,power:7-s}))),...Array.from({length:14},()=>({type:'heal',speed:0,power:1})),...Array.from({length:6},()=>({type:'heal',speed:0,power:2}))]);let db,auth,uid,roomId,room,selected=-1,count=2,processing=false;const config=window.GALAXY_FIREBASE_CONFIG||{};if(!config.apiKey||!config.projectId){$('#setupError').textContent='Multiplayer da configurare: completa firebase-config.js seguendo ISTRUZIONI_ONLINE.txt';$('#create').disabled=$('#join').disabled=true}else{try{const app=initializeApp(config);db=getFirestore(app);auth=getAuth(app);await signInAnonymously(auth);uid=auth.currentUser.uid;$('#setupError').textContent='Connesso al server multiplayer.'}catch(e){$('#setupError').textContent='Firebase: '+e.message;$('#create').disabled=$('#join').disabled=true}}
const roomRef=()=>ref(db,'rooms/'+roomId), safe=fn=>async()=>{try{await fn()}catch(e){alert('Errore: '+e.message)}};document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{$('#count').textContent=count=+b.dataset.count});const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
$('#create').onclick=safe(async()=>{roomId=code();await set(roomRef(),{host:uid,limit:count,phase:'lobby',createdAt:Date.now(),players:{[uid]:{name:'',hp:5,credits:0,bounties:0,hand:[]}},order:[uid],round:0});subscribe()});$('#join').onclick=safe(async()=>{roomId=$('#code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(roomId))throw Error('Codice non valido');const snap=await get(roomRef());if(!snap.exists())throw Error('Stanza inesistente');const r=snap.val();if(r.phase!=='lobby')throw Error('Partita già iniziata');if(!r.players?.[uid]&&r.order.length>=r.limit)throw Error('Stanza piena');await runTransaction(roomRef(),r=>{if(!r||r.phase!=='lobby')return;if(!r.players?.[uid]){if(r.order.length>=r.limit)return;r.players[uid]={name:'',hp:5,credits:0,bounties:0,hand:[]};r.order.push(uid)}return r});subscribe()});$('#share').onclick=()=>navigator.clipboard?.writeText(location.origin+location.pathname+'?room='+roomId).then(()=>alert('Invito copiato')).catch(()=>prompt('Copia il link:',location.href+'?room='+roomId));
function subscribe(){onValue(roomRef(),s=>{if(!s.exists()){alert('Stanza non disponibile');return}room=s.val();render()})}function names(){return room.order.map(id=>room.players[id]?.name).filter(Boolean)}
function render(){if(!room)return;$('#setup').classList.add('hide');$('#lobby').classList.toggle('hide',room.phase!=='lobby');$('#game').classList.toggle('hide',room.phase==='lobby');if(room.phase==='lobby'){$('#roomCode').textContent=roomId;$('#choices').replaceChildren();hunters.forEach(n=>{const b=document.createElement('button');b.className='choice';b.disabled=names().includes(n)&&room.players[uid]?.name!==n;b.innerHTML=`<img class="badge" src="${badge(n)}"><br>${n}`;b.onclick=safe(async()=>{await runTransaction(roomRef(),r=>{if(!r||r.phase!=='lobby'||!r.players[uid])return;if(Object.entries(r.players).some(([id,p])=>id!==uid&&p.name===n))return;r.players[uid].name=n;return r})});$('#choices').append(b)});$('#lobbyPlayers').innerHTML=room.order.map(id=>`<div class="person">${room.players[id].name||'IN ATTESA'} ${id===room.host?'★':''}</div>`).join('');$('#lobbyInfo').textContent=`${room.order.length}/${room.limit} giocatori · Tutti devono scegliere un cacciatore`;$('#start').classList.toggle('hide',uid!==room.host);$('#start').disabled=room.order.length!==room.limit||names().length!==room.limit;return}const me=room.players[uid];if(!me)return;$('#round').textContent='TAGLIA '+room.round+'/20';$('#players').innerHTML=room.order.map(id=>{const p=room.players[id];return `<div class="person"><img class="badge" src="${badge(p.name)}"><div>♥ ${p.hp} · ${p.credits}¢</div></div>`}).join('');$('#health').textContent=`♥ ${room.current?.hp||0} / ${room.current?.maxHp||0}`;$('#wanted').src=wantedAsset(room.current?.name||'');$('#wantedName').textContent=room.current?.name||'';$('#deckCount').textContent=(room.deck||[]).length+' carte';$('#discardCount').textContent=(room.discard||[]).length+' carte';const last=(room.discard||[]).at(-1);$('#discard').src=last?asset(last):'./card-back.webp';$('#slots').replaceChildren();room.order.forEach(id=>{const c=room.plays?.[id];const box=document.createElement('div');box.className='slot';box.innerHTML=`<div>${room.players[id].name}</div><img src="${c?(room.phase==='reveal'||room.phase==='duel'||room.phase==='finished'?asset(c):'./card-back.webp'):'./card-back.webp'}" style="opacity:${c?1:.25}">`;$('#slots').append(box)});$('#duel').classList.toggle('hide',room.phase!=='duel');$('#duelInfo').textContent='Parità di velocità: i giocatori coinvolti scelgono una carta aggiuntiva.';$('#duelSlots').innerHTML=(room.duelIds||[]).map(id=>`<div class="slot">${room.players[id].name}<br><img src="${room.duelPicks?.[id]?'./card-back.webp':'./card-back.webp'}" style="opacity:${room.duelPicks?.[id]?1:.25}"></div>`).join('');const picking=room.phase==='choose'&&!room.plays?.[uid]||room.phase==='duel'&&(room.duelIds||[]).includes(uid)&&!room.duelPicks?.[uid];$('#phase').textContent=({choose:'SCEGLI UNA CARTA',reveal:'CARTE RIVELATE',duel:'DUELLO!',finished:'FINE PARTITA'})[room.phase]||'';$('#hand').replaceChildren();(me.hand||[]).forEach((c,i)=>{const b=document.createElement('button');b.className=selected===i?'sel':'';b.innerHTML=`<img src="${asset(c)}" alt="${c.type} ${c.speed}">`;b.onclick=()=>{selected=i;render()};$('#hand').append(b)});$('#play').disabled=!picking||selected<0||me.hp<=0;$('#play').textContent=room.phase==='duel'?'SCARTA PER IL DUELLO':'GIOCA CARTA COPERTA';$('#info').textContent=picking?'Scegli una carta dalla tua mano.':room.phase==='finished'?'Partita terminata.':'In attesa degli altri cacciatori…';$('#log').textContent=(room.log||[]).slice(-7).reverse().join('\n')}
$('#start').onclick=safe(async()=>{if(uid!==room.host)return;const d=deck(),players=structuredClone(room.players);for(const id of room.order){players[id].hand=d.splice(0,5)}const w=shuffle(wanted.map(([name,value,power])=>({name,value,power})));const {name,value,power}=w.pop();await update(roomRef(),{phase:'choose',players,deck:d,wanted:w,current:{name,value,power,hp:room.limit*5,maxHp:room.limit*5},round:1,plays:{},duelPicks:{},duelIds:[],log:['Partita iniziata']})});$('#play').onclick=safe(async()=>{if(selected<0)return;const ix=selected;selected=-1;await runTransaction(roomRef(),r=>{if(!r||!r.players?.[uid]||r.players[uid].hp<=0)return;const duel=r.phase==='duel';if(!duel&&r.phase!=='choose')return;if(duel&&(!(r.duelIds||[]).includes(uid)||r.duelPicks?.[uid]))return;if(!duel&&r.plays?.[uid])return;const hand=r.players[uid].hand||[];if(ix>=hand.length)return;const [c]=hand.splice(ix,1);if(duel){r.duelPicks=r.duelPicks||{};r.duelPicks[uid]=c}else{r.plays=r.plays||{};r.plays[uid]=c}return r})});
// Solo il creatore della stanza risolve i turni. La transazione impedisce doppie risoluzioni.
function speed(c){return c.type==='heal'?0:c.speed}function advance(r){const active=r.order.filter(id=>r.players[id].hp>0);if(r.phase==='choose'&&active.every(id=>r.plays?.[id])){r.phase='reveal';r.revealedAt=Date.now();r.log.push('Carte rivelate');return r}if(r.phase==='reveal'&&Date.now()-(r.revealedAt||0)>=2000){const groups={};active.forEach(id=>{const s=speed(r.plays[id]);(groups[s]??=[]).push(id)});const tied=Object.values(groups).filter(g=>g.length>1).flat();if(tied.length){r.phase='duel';r.duelIds=tied;r.duelPicks={};r.log.push('DUELLO: velocità uguali');return r}return resolve(r)}if(r.phase==='duel'&&(r.duelIds||[]).every(id=>r.duelPicks?.[id]||!(r.players[id].hand||[]).length)){return resolve(r)}return}
function resolve(r){const ids=r.order.filter(id=>r.plays?.[id]&&r.players[id].hp>0);const duels=r.duelPicks||{};ids.sort((a,b)=>speed(r.plays[b])-speed(r.plays[a])||speed(duels[b]||{type:'heal'})-speed(duels[a]||{type:'heal'})||r.order.indexOf(a)-r.order.indexOf(b));let capture=null;for(const id of ids){const p=r.players[id],c=r.plays[id];if(c.type==='heal'){p.hp=Math.min(5,p.hp+c.power);r.log.push(p.name+' cura '+c.power)}else if(r.current.hp>0){r.current.hp=Math.max(0,r.current.hp-c.power);r.log.push(p.name+' infligge '+c.power+' danni');if(r.current.hp===0){capture=id;break}}}const attackersBeforeClear=ids.filter(id=>r.plays?.[id]?.type==='attack');r.discard=[...(r.discard||[]),...Object.values(r.plays||{}),...Object.values(duels)];r.plays={};r.duelPicks={};r.duelIds=[];if(capture){const p=r.players[capture];p.credits+=r.current.value;p.bounties++;r.log.push(p.name+' cattura '+r.current.name);if(!r.wanted?.length||p.bounties>=10){r.phase='finished';return r}const {name,value,power}=r.wanted.pop();r.current={name,value,power,hp:r.limit*5,maxHp:r.limit*5};r.round++}else{const target=attackersBeforeClear.at(-1);if(target){r.players[target].hp=Math.max(0,r.players[target].hp-r.current.power);r.log.push(r.current.name+' contrattacca '+r.players[target].name)}}if(r.order.filter(id=>r.players[id].hp>0).length<=1){r.phase='finished';return r}for(const id of r.order){const p=r.players[id];if(p.hp<=0)continue;while(p.hand.length<5){if(!r.deck.length){r.deck=shuffle(r.discard||[]);r.discard=[]}if(!r.deck.length)break;p.hand.push(r.deck.pop())}}r.phase='choose';return r}
let busy=false;setInterval(async()=>{if(!room||uid!==room.host||busy||!['choose','reveal','duel'].includes(room.phase))return;const active=room.order.filter(id=>room.players[id].hp>0);const ready=room.phase==='choose'&&active.every(id=>room.plays?.[id])||room.phase==='reveal'&&Date.now()-(room.revealedAt||0)>=2000||room.phase==='duel'&&(room.duelIds||[]).every(id=>room.duelPicks?.[id]||!room.players[id].hand?.length);if(!ready)return;busy=true;try{await runTransaction(roomRef(),r=>{if(!r)return;return advance(r)})}catch(e){console.error(e)}finally{busy=false}},650);
const invite=new URLSearchParams(location.search).get('room');if(invite){$('#code').value=invite.toUpperCase()}
</script></body></html>
